plugins { id 'java'; id 'org.springframework.boot' version '4.1.2'; id 'io.spring.dependency-management' version '1.1.7' }
java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
dependencies { implementation 'org.springframework.boot:spring-boot-starter-web'; implementation 'com.fasterxml.jackson.core:jackson-databind'; implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'; implementation 'org.springframework.boot:spring-boot-starter-validation'; testImplementation 'org.springframework.boot:spring-boot-starter-test' }
tasks.named('test') { useJUnitPlatform() }
