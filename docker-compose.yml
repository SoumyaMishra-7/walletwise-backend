services:
  mongodb:
    image: mongo:8
    volumes: [mongo-data:/data/db]
    healthcheck: { test: ["CMD","mongosh","--eval","db.runCommand('ping').ok"], interval: 10s, timeout: 5s, retries: 5 }
  auth-service:
    build: { context: ., dockerfile: auth-service/Dockerfile }
    environment:
      MONGODB_URI: mongodb://mongodb:27017/walletwise
      JWT_SECRET: ${JWT_SECRET}
    depends_on: { mongodb: { condition: service_healthy } }
  finance-1:
    build: { context: ., dockerfile: finance-service/Dockerfile }
    environment:
      MONGODB_URI: mongodb://mongodb:27017/walletwise
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8082
    depends_on: { mongodb: { condition: service_healthy } }
  finance-2:
    build: { context: ., dockerfile: finance-service/Dockerfile }
    environment:
      MONGODB_URI: mongodb://mongodb:27017/walletwise
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8082
    depends_on: { mongodb: { condition: service_healthy } }
  gateway:
    image: nginx:alpine
    ports: ["8080:8080"]
    volumes: [./gateway/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [auth-service, finance-1, finance-2]
volumes: { mongo-data: {} }
