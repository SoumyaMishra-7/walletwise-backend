spring.application.name=auth-service
server.port=${SERVER_PORT:8081}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/walletwise}
walletwise.jwt.secret=${JWT_SECRET:change-this-in-production-to-a-32-byte-minimum-secret}
walletwise.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
